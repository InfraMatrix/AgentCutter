[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcutter"
version = "0.1.0"
description = "AgentLoupe inspects, AgentCutter cuts: explain agent captures with Muse Spark."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.scripts]
agentcutter = "agentcutter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
